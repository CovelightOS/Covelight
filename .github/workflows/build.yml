name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # T1.4 (docs/plan/02-phase1-shell.md, security): builds the GDExtension
  # (shell/rust/pck_verify, wraps covelight-crypto) and the sign CLI
  # (tools/sign), shared by godot-export and godot-test below via
  # upload/download-artifact so it's compiled once, not twice. Both of
  # those jobs need real binaries present before ANY headless Godot
  # command touches /shell at all -- shell/scripts/pck_loader.gd
  # references the PckVerifier class by name at parse time, so a missing
  # GDExtension binary breaks the whole project's script compilation, not
  # just PCK loading (verified directly against the real engine, not
  # assumed -- see docs/research/godot-pck-gdextension.md and
  # shell/rust/build_gdextension.sh's own comment). That's intentional:
  # making verification quietly optional whenever the binary happens to be
  # missing would itself be the kind of dev-convenience bypass CLAUDE.md #3
  # forbids.
  build-gdextension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-gdextension-${{ runner.os }}-${{ hashFiles('shell/rust/pck_verify/Cargo.lock', 'tools/Cargo.lock') }}

      - name: Build GDExtension (release)
        run: shell/rust/build_gdextension.sh --release

      - name: Build sign CLI (release)
        working-directory: tools
        run: cargo build --release -p sign

      - uses: actions/upload-artifact@v4
        with:
          name: gdextension-and-sign-linux
          path: |
            shell/addons/covelight_pck_verify/bin/
            tools/target/release/sign
          if-no-files-found: error

  # T1.1 (docs/plan/02-phase1-shell.md): headless Linux export of /shell.
  # Fails the build if the project doesn't export cleanly. A version/export
  # matrix can follow once more than one export target exists.
  godot-export:
    needs: build-gdextension
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_TEMPLATES_DIR: 4.7.stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gdextension-and-sign-linux
          path: .
      - run: chmod +x shell/addons/covelight_pck_verify/bin/* tools/target/release/sign

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-editor
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-editor
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-editor

      - name: Download export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}
          curl -fL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          # Official .tpz archives nest everything under a top-level
          # "templates/" folder; fall back to a flat layout defensively.
          if [ -d /tmp/templates_extracted/templates ]; then
            mv /tmp/templates_extracted/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}/
          else
            mv /tmp/templates_extracted/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}/
          fi

      - name: Export Linux debug build
        run: |
          GODOT_BIN=$(find ~/godot-editor -maxdepth 1 -type f -iname "Godot*" | head -1)
          chmod +x "$GODOT_BIN"
          mkdir -p shell/build
          "$GODOT_BIN" --headless --path shell --export-debug "Linux" build/shell.x86_64
          test -f shell/build/shell.x86_64

  # T1.2 (docs/plan/02-phase1-shell.md): GUT tests for the shell state
  # machine, including crash containment. Also T1.4's PCK-verification
  # tests now that they live in shell/tests/ alongside these -- same GUT
  # run picks both up. GUT itself, if a test script fails to parse, prints
  # "Nothing was run" but still exits 0 -- the final grep guards against
  # that silently going green.
  godot-test:
    needs: build-gdextension
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gdextension-and-sign-linux
          path: .
      - run: chmod +x shell/addons/covelight_pck_verify/bin/* tools/target/release/sign

      - name: Cache Godot editor
        id: godot-editor-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-editor
          key: godot-${{ env.GODOT_VERSION }}-linux-editor

      - name: Download Godot editor
        if: steps.godot-editor-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-editor
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-editor

      - name: Run GUT tests
        run: |
          set -euo pipefail
          GODOT_BIN=$(find ~/godot-editor -maxdepth 1 -type f -iname "Godot*" | head -1)
          chmod +x "$GODOT_BIN"
          # class_name resolution needs one editor-mode pass over a fresh
          # checkout (undocumented Godot behavior, found by testing this
          # locally, not assumed) -- GUT's own error message points at
          # this exact fix if skipped.
          "$GODOT_BIN" --headless --path shell --import
          "$GODOT_BIN" --headless --path shell -s addons/gut/gut_cmdln.gd -gexit | tee /tmp/gut-output.log
          grep -q "All tests passed!" /tmp/gut-output.log

  # T1.3 + T1.6 (docs/plan/02-phase1-shell.md): each activity project is its
  # own Godot project (not /shell), so each gets its own lint + import +
  # export-pack + GUT run, mirroring godot-export/godot-test above. The
  # matrix covers the SDK template (T1.3 -- template rot would otherwise be
  # silent until someone copies it) and T1.6's three first activities, the
  # reference examples every contributor copies. Verifying + loading the
  # *signed* pcks in the shell is godot-test's job (test_real_click loads a
  # committed content pck end-to-end); this job proves each activity's own
  # source builds and passes its own suite.
  godot-activity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        activity: [_template, animal_sounds, shape_sorter, color_mixing]
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_TEMPLATES_DIR: 4.7.stable
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-editor
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-editor
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-editor

      - name: Download export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}
          curl -fL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          if [ -d /tmp/templates_extracted/templates ]; then
            mv /tmp/templates_extracted/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}/
          else
            mv /tmp/templates_extracted/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}/
          fi

      - name: Lint (static text/network scan)
        run: tools/lint_activity.sh activities/${{ matrix.activity }}

      - name: Import + export pack
        run: |
          GODOT_BIN=$(find ~/godot-editor -maxdepth 1 -type f -iname "Godot*" | head -1)
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path activities/${{ matrix.activity }} --import
          mkdir -p activities/${{ matrix.activity }}/build
          "$GODOT_BIN" --headless --path activities/${{ matrix.activity }} --export-pack "Linux" build/activity.pck
          test -f activities/${{ matrix.activity }}/build/activity.pck

      - name: Run GUT tests
        run: |
          set -euo pipefail
          GODOT_BIN=$(find ~/godot-editor -maxdepth 1 -type f -iname "Godot*" | head -1)
          "$GODOT_BIN" --headless --path activities/${{ matrix.activity }} -s addons/gut/gut_cmdln.gd -gexit | tee /tmp/gut-activity-output.log
          grep -q "All tests passed!" /tmp/gut-activity-output.log

  # T2.1 (docs/plan/03-phase2-kiosk.md): Tier 1 Android kiosk wrapper.
  # /app is a plain Kotlin app depending on the stock Godot Android engine
  # library (org.godotengine:godot, Maven Central) -- NOT Godot's own
  # self-contained export -- so this job independently (a) cross-compiles
  # the T1.4 GDExtension for Android (shell/rust/build_gdextension_android.sh;
  # doesn't need the desktop build-gdextension artifact, a completely
  # different set of binaries for a completely different OS), (b) packs
  # /shell's resources for Android with `--export-pack` (no APK/AAB
  # produced by Godot itself here, so no export-templates download needed --
  # verified locally: `--export-pack` doesn't touch custom_template/debug
  # or custom_template/release at all), (c) wires both into /app's standard
  # Gradle source sets (assets/, jniLibs/), and (d) runs a real
  # `gradlew assembleDebug`, which enforces the CLAUDE.md #9 dependency
  # audit (assertNoGoogleDependencies) as a preBuild step -- not a separate
  # optional job, so a Google/Play dependency fails the same build that
  # produces the APK. Uploads the APK so the required human device-verify
  # (T2.1's acceptance criterion) doesn't also require a local build.
  android-build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
      ANDROID_NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-gdextension-android-${{ runner.os }}-${{ hashFiles('shell/rust/pck_verify/Cargo.lock', 'tools/Cargo.lock') }}

      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" "platforms;android-36" "build-tools;36.1.0"

      - name: Build GDExtension for Android (release)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          shell/rust/build_gdextension_android.sh --release

      - name: Cache Godot editor
        id: godot-editor-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-editor
          key: godot-${{ env.GODOT_VERSION }}-linux-editor

      - name: Download Godot editor
        if: steps.godot-editor-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-editor
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-editor

      - name: Export shell.pck for Android
        run: |
          set -euo pipefail
          GODOT_BIN=$(find ~/godot-editor -maxdepth 1 -type f -iname "Godot*" | head -1)
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path shell --import
          mkdir -p shell/build
          "$GODOT_BIN" --headless --path shell --export-pack "Android" build/shell.pck
          test -f shell/build/shell.pck

      - name: Wire GDExtension + PCK into /app
        run: |
          set -euo pipefail
          cp shell/build/shell.pck app/app/src/main/assets/shell.pck
          mkdir -p app/app/src/main/jniLibs/arm64-v8a app/app/src/main/jniLibs/armeabi-v7a
          cp shell/addons/covelight_pck_verify/bin/android/arm64-v8a/libcovelight_pck_verify.so app/app/src/main/jniLibs/arm64-v8a/
          cp shell/addons/covelight_pck_verify/bin/android/armeabi-v7a/libcovelight_pck_verify.so app/app/src/main/jniLibs/armeabi-v7a/

      - name: Gradle build (assembleDebug -- includes the CLAUDE.md #9 dependency audit)
        working-directory: app
        run: ./gradlew assembleDebug --console=plain

      - run: test -f app/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: covelight-app-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # T0.4 (docs/plan/01-phase0-foundation.md): covelight-crypto + the sign CLI
  # in /tools. Phase 4 adds syncd to this same workspace/job; a Rust
  # toolchain matrix can follow once more than one crate needs one.
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo test
        working-directory: tools
        run: cargo test --workspace
      - name: cargo fmt --check
        working-directory: tools
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: tools
        run: cargo clippy --workspace --all-targets -- -D warnings

  # T1.4 (docs/plan/02-phase1-shell.md, security): the GDExtension crate
  # itself. Separate from rust-test above (different directory, not part
  # of the /tools workspace -- shell/rust/pck_verify depends on
  # covelight-crypto by relative path instead) but the same conventions
  # apply repo-wide (CLAUDE.md): cargo fmt + clippy -D warnings, real
  # tests, no exceptions for being a cdylib.
  rust-test-gdextension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo test
        working-directory: shell/rust/pck_verify
        run: cargo test
      - name: cargo fmt --check
        working-directory: shell/rust/pck_verify
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: shell/rust/pck_verify
        run: cargo clippy --all-targets -- -D warnings
